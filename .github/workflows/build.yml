name: Build & Deploy
on:
  push: {branches: [main]}
  schedule: [{cron: "*/15 * * * *"}]
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write, actions: write}
concurrency: {group: pages, cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: .ogcache
          key: ogcache-v1-${{ github.run_id }}
          restore-keys: ogcache-v1-
      - run: python scripts/build.py
        env: {SITE_URL: "${{ vars.SITE_URL || 'https://groundlevelnews.com' }}"}
      - name: Check LLM discoverability layer (llmbestpractices.com)
        run: python scripts/check_llm_layer.py _site
      - uses: actions/upload-pages-artifact@v3
        with: {path: _site}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Ping IndexNow (Bing and partners; free)
        run: |
          sleep 30
          python3 - <<'PY'
          import json, urllib.request
          host = "groundlevelnews.com"; key = "5a8308b39ca87422bfd5d4eb53c1c5bb"
          try:
              urls = urllib.request.urlopen(f"http://{host}/indexnow-urls.txt", timeout=30).read().decode().split()
          except Exception as e:
              print("could not fetch url list:", e); urls = [f"https://{host}/"]
          body = json.dumps({"host": host, "key": key, "keyLocation": f"https://{host}/{key}.txt", "urlList": urls[:10000]}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body, headers={"Content-Type": "application/json; charset=utf-8"})
          try:
              r = urllib.request.urlopen(req, timeout=30); print("IndexNow", r.status, len(urls), "urls")
          except Exception as e:
              print("IndexNow error:", e)
          PY
