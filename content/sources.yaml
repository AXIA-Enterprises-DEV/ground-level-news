# Regional source registry for Ground Level News (read by scripts/gln/sources.py).
#
# Every enabled feed below was probed with curl on 2026-10-18 and returned HTTP 200 with parseable
# RSS/Atom. Feeds are fetched at build time, in parallel, with a 12s per-feed timeout; a failing feed is
# logged and skipped (it never fails the build). Items are normalised to the tracker item shape with
# cat="local", local=true, via="direct", regions=[region + regions_extra + detected regions].
#
# Fields per source (DECISIONS.md section 13):
#   key            stable id; also the fixture file name tests/fixtures/feeds/<key>.xml for offline builds
#   name           publisher display name shown as the item's `source`
#   url            feed URL
#   kind           gov | media | events | agency | college | tourism  (items inherit it, except events feeds
#                  whose items get kind "event" or "meeting")
#   region         taxonomy region key the feed is about
#   regions_extra  more region keys every item from this feed carries
#   tier           1 = primary/official, 2 = regional media or agency, 3 = fallback (Google News queries)
#   homepage       publisher homepage (for "More from <source>")
#   paywalled      true for metered/paywalled publishers (BLOX group papers)
#   notes          free text
# Optional per-source controls:
#   tz             IANA zone for feeds whose dates carry no offset (default America/Phoenix)
#   must_match     a filter name from `filters:` or a list of regexes; keep only items whose title+summary match
#   drop           a filter name or list of regexes; drop items whose title+summary match
#   drop_link      list of regexes applied to the item link (BLOX "online_features" paid releases etc.)
#   item_kind      force the item kind (e.g. "meeting" for CivicPlus Meetings calendars)
#   max_age_days   override the 14-day freshness window
#   enabled        false to keep the record but never fetch it

defaults:
  max_age_days: 14
  tz: America/Phoenix

filters:
  # Colorado River region place names. Used to keep only region-relevant items from statewide /
  # Las Vegas-metro feeds. Case-sensitive on purpose (proper nouns); "mesquite tree" etc. is excluded.
  river:
    - '\bBullhead City\b'
    - '\bLaughlin\b'
    - '\bFort Moh?[aj]ve\b'
    - '\bMoh?[aj]ve Valley\b'
    - '\bMohave County\b'
    - '\bKingman\b'
    - '\b(Lake )?Havasu\b'
    - '\bNeedles\b'
    - '\bBoulder City\b'
    - '\bMesquite\b(?!\s+(tree|trees|wood|smoke|smoked|grill|grilled|flour|bean|beans|chips?|charcoal|BBQ|barbecue|Street|St\.|Ave\.?|Avenue|Road|Rd\.?|Lane|Ln\.?))'
    - '\bLake Mead\b'
    - '\bHoover Dam\b'
    - '\bLake Mohave\b'
    - '\bDavis Dam\b'
    - '\bParker Dam\b'
    - '\bColorado River\b'
    - '\bVirgin River\b'
    - '\bSearchlight\b'
    - '\bMoapa\b'
    - '\bOverton\b'
    - '\bLogandale\b'
    - '\bBunkerville\b'
    - '\bGolden Valley\b'
    - '\bDolan Springs\b'
    - '\bOatman\b'
    - '\bTopock\b'
    - '\bWillow Beach\b'
    - '\bCottonwood Cove\b'
    - '\bKatherine Landing\b'
    - '\bColorado City\b'
    - '\bMohave Community College\b'
    - '\bMohave College\b'
  # River terms plus statewide governance that affects the region directly.
  statewide:
    - '\bBullhead City\b'
    - '\bLaughlin\b'
    - '\bFort Moh?[aj]ve\b'
    - '\bMoh?[aj]ve Valley\b'
    - '\bMohave County\b'
    - '\bKingman\b'
    - '\b(Lake )?Havasu\b'
    - '\bBoulder City\b'
    - '\bMesquite\b(?!\s+(tree|trees|wood|smoke|smoked|grill|grilled|flour|bean|beans|chips?|charcoal|BBQ|barbecue|Street|St\.|Ave\.?|Avenue|Road|Rd\.?|Lane|Ln\.?))'
    - '\bLake Mead\b'
    - '\bHoover Dam\b'
    - '\bLake Mohave\b'
    - '\bColorado River\b'
    - '\bVirgin River\b'
    - '\bMoapa\b'
    - '\bOverton\b'
    - '\bLogandale\b'
    - '\bBunkerville\b'
    - '\bSearchlight\b'
    - '\bClark County Commission(ers)?\b'
    - '\bearly voting\b'
    - '\bElection Day\b'
    - '\bballot question\b'
    - '\bwater (shortage|cuts?|allocation|rights)\b'
    - '\bBureau of Reclamation\b'
    - '\bdrought\b'
  # Google News query noise: obituaries from elsewhere, high-school video spam, surname hits.
  gnews_junk:
    - '(?i)\bobituar(y|ies)\b'
    - '(?i)\bMaxPreps\b'
    - '(?i)\bNFHS Network\b'
    - '(?i)\bWatch Live\b'
    - '(?i)\bLegacy(\.com)? \| Obituary'
    - '(?i)\bfuneral home\b'
    - '(?i)\bhomes? for sale\b'
    - '(?i)\bzillow\b'

# Link hosts that are never usable as a story (social posts, ticketing). Eventbrite is allowed for events.
denylist_hosts:
  - facebook.com
  - m.facebook.com
  - twitter.com
  - x.com
  - instagram.com
  - tiktok.com
  - youtube.com
  - youtu.be
  - legacy.com

